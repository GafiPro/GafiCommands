name: Build JAR

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
          validate-wrappers: false
      - name: Run tests and build the remapped mod JAR
        run: gradle test build --no-daemon
      - name: Upload Fabric mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: GafiCommands-1.1.0
          path: build/libs/gaficommands-1.1.0.jar
          if-no-files-found: error
          retention-days: 30
